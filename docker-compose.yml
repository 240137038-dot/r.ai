version: "3.8"
services:
  assistant:
    build: .
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ELEVEN_API_KEY=${ELEVEN_API_KEY}
      - ELEVEN_VOICE_ID=${ELEVEN_VOICE_ID}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - DB_PATH=/data/assistant.db
    volumes:
      - ./data:/data
